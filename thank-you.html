<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Professional cleaning services for homes and businesses in Kenya. Fast, reliable, and affordable.">
    <meta name="keywords" content="cleaning services, home cleaning, office cleaning, professional cleaners, Kenya">
    <title>Thank You | KM Cleaning Services</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
        }
        .thank-you-wrap {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 40px 20px;
        }
        .thank-you-box {
            max-width: 680px;
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
            padding: 48px 32px;
            text-align: center;
        }
        .thank-you-box i {
            font-size: 4rem;
            color: #10b981;
            margin-bottom: 20px;
        }
        .thank-you-box h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            color: #1f2937;
            margin-bottom: 14px;
        }
        .thank-you-box p {
            font-size: 1.1rem;
            color: #4b5563;
            margin-bottom: 26px;
        }
        .thank-you-box .btn {
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="thank-you-wrap">
        <div class="thank-you-box">
            <i class="fas fa-check-circle"></i>
            <h1>Thank You!</h1>
            <p>Your message has been received. Our team will review your request and contact you shortly.</p>
            <a href="index.html" class="btn btn-primary">Back to Homepage</a>
        </div>
    </div>
</body>
</html>
